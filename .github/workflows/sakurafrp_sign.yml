name: SakuraFrp 自动签到

on:
  # 定时任务：北京时间 9 / 10 / 11 / 12 点各触发一次（UTC 1 / 2 / 3 / 4 点）
  # 原因：GitHub 免费 runner 的 schedule 经常延迟数小时甚至整次跳过，
  # 所以多挂几个时间点做兜底；脚本碰到「今日已签到」会立即退出，重复触发无副作用。
  schedule:
    - cron: '0 1,2,3,4 * * *'
  
  # 允许手动触发
  workflow_dispatch:
  
jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install-deps chromium
      
      - name: 运行签到脚本
        env:
          SAKURAFRP_USER: ${{ secrets.SAKURAFRP_USER }}
          SAKURAFRP_PASS: ${{ secrets.SAKURAFRP_PASS }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          MODEL: ${{ secrets.MODEL }}
          MODEL_FALLBACK: ${{ secrets.MODEL_FALLBACK }}
          IMAGE_AS_BASE64: ${{ secrets.IMAGE_AS_BASE64 || 'false' }}
          CI: 'true'
          HEADLESS: 'true'
        run: |
          python main.py
      
      # 第一次失败（常见原因：验证码识别偏差、免费模型 429 限流）时再跑一遍。
      # 脚本内部已做退避重试，这里再兜一层，两次都失败才算失败。
      - name: 失败后重试一次
        if: failure()
        env:
          SAKURAFRP_USER: ${{ secrets.SAKURAFRP_USER }}
          SAKURAFRP_PASS: ${{ secrets.SAKURAFRP_PASS }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          MODEL: ${{ secrets.MODEL }}
          MODEL_FALLBACK: ${{ secrets.MODEL_FALLBACK }}
          IMAGE_AS_BASE64: ${{ secrets.IMAGE_AS_BASE64 || 'false' }}
          CI: 'true'
          HEADLESS: 'true'
        run: |
          echo "上次执行未成功，等待 90 秒后重试..."
          sleep 90
          python main.py
      
      - name: 发送邮件通知
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL || secrets.EMAIL_USERNAME }}
        run: |
          python send_email.py
      
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs
          path: |
            checkin.log
            error_screenshot.png
            error_page_source.html
          retention-days: 7
